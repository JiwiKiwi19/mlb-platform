name: mlb-streaming-cluster

# Usage:
#   docker compose up -d --build                         # live MLB feed
#   docker compose --profile simulator up -d --build     # add synthetic pitches + chaos
#
# Required env (shell or .env next to this file):
#   SUPABASE_URL, SUPABASE_KEY (service role)            → consumer
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY → frontend build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-pipeline: &pipeline
  <<: *hardening
  build:
    context: ./backend
  image: mlb-pipeline:latest
  restart: unless-stopped
  logging: *logging
  networks:
    - mlb_network
  depends_on:
    topic-init:
      condition: service_completed_successfully

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: redpanda-broker
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-broker:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-broker:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - 19092:19092
      - 18081:18081
      - 18082:18082
      - 19644:9644
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - mlb_network
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  # One-shot: create topics explicitly instead of relying on broker auto-create.
  # 3 partitions allow scaling consumers; messages are keyed by game:pitcher.
  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: redpanda-topic-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        rpk() { command rpk -X brokers=redpanda-broker:9092 "$$@"; }
        ensure() { rpk topic describe "$$1" >/dev/null 2>&1 || rpk topic create "$$@"; }
        ensure live-pitches -p 3 -r 1 -c retention.ms=604800000
        ensure live-pitches.dlq -p 1 -r 1 -c retention.ms=2592000000
        rpk topic list
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - mlb_network
    restart: "no"
    logging: *logging

  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    container_name: redpanda-console
    networks:
      - mlb_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-broker:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda-broker:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-broker:9644"]
    ports:
      - 8080:8080
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  producer:
    <<: *pipeline
    container_name: mlb-producer
    command: ["python", "-m", "mlb_pipeline.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda-broker:9092
      TEAM_ID: ${TEAM_ID:-141}
      TEAM_ABBREVIATION: ${TEAM_ABBREVIATION:-TOR}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  consumer:
    <<: *pipeline
    container_name: mlb-consumer
    command: ["python", "-m", "mlb_pipeline.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda-broker:9092
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_KEY: ${SUPABASE_KEY:?SUPABASE_KEY (service role) is required}
      TEAM_ABBREVIATION: ${TEAM_ABBREVIATION:-TOR}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  simulator:
    <<: *pipeline
    container_name: mlb-simulator
    profiles: ["simulator"]
    command: ["python", "-m", "mlb_pipeline.simulator"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda-broker:9092
      CHAOS_MODE: ${CHAOS_MODE:-random}
      CHAOS_PROBABILITY: ${CHAOS_PROBABILITY:-0.05}
      CHAOS_FATIGUE_INTERVAL: ${CHAOS_FATIGUE_INTERVAL:-12}
      CHAOS_FATIGUE_DURATION: ${CHAOS_FATIGUE_DURATION:-12}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required}
    image: mlb-frontend:latest
    container_name: mlb-frontend
    tmpfs:
      - /tmp
      - /app/.next/cache
    ports:
      - 3005:3000
    restart: unless-stopped
    logging: *logging
    networks:
      - mlb_network

networks:
  mlb_network:
    driver: bridge

volumes:
  redpanda-data:
