# Fly.io configuration for the Next.js frontend.
# App name must be globally unique — update "mlb-frontend-staging" before deploying.
#
# Initial setup (run once):
#   fly apps create mlb-frontend-staging   # or your chosen app name
#
# Deployment (handled by CI via deploy-staging job):
#   fly deploy --image ghcr.io/<owner>/<repo>/mlb-frontend:<sha> --ha=false
#
# The app name here is used by `fly deploy` when run from this directory.
# For production, copy this file or override with --app flag.

app = "mlb-frontend-staging"
primary_region = "yyz"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
