# Railway config-as-code, shared by the backend services (set Root Directory = backend).
# The image CMD runs the consumer. For the producer service, override the start
# command in Railway → Settings → Deploy: python -m mlb_pipeline.producer
#
# Environment variables are set per service in Railway (never committed):
#   KAFKA_BOOTSTRAP_SERVERS, KAFKA_SECURITY_PROTOCOL=SASL_SSL,
#   KAFKA_SASL_MECHANISM, KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD,
#   SUPABASE_URL, SUPABASE_KEY (consumer only)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Workers have no HTTP port, so Railway can't health-check them; restart on crash instead.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
