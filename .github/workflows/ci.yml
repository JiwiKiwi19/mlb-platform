name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=75

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder values: the build only needs them to exist; no network calls happen at build time.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_TEAM_ABBREVIATION: TOR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7
      - run: npm run build

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: frontend
        # --package-lock-only reads from the lockfile without installing packages.
        # continue-on-error: remaining findings are tied to next@14.x and require
        # a Next.js 15+ upgrade (breaking). Remove once that upgrade lands.
        continue-on-error: true
        run: npm audit --audit-level=high --package-lock-only
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (+ push on main) backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/mlb-pipeline:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/mlb-pipeline:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build (+ push on main) frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/mlb-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/mlb-frontend:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
            NEXT_PUBLIC_TEAM_ABBREVIATION=TOR
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Deployment ──────────────────────────────────────────────────────────────
  # Both deploy jobs only run on pushes to main (not PRs).
  # Prerequisites before these jobs will succeed:
  #   1. Create Fly.io apps:
  #        fly apps create mlb-frontend-staging  (from frontend/)
  #        fly apps create mlb-consumer-staging  (from backend/)
  #        fly apps create mlb-frontend-prod     (from frontend/)
  #        fly apps create mlb-consumer-prod     (from backend/)
  #   2. Set Fly.io secrets per app:
  #        fly secrets set SUPABASE_URL=... SUPABASE_KEY=... --app mlb-consumer-staging
  #   3. Add FLY_API_TOKEN to GitHub → Settings → Secrets (repo level).
  #   4. Create GitHub environments named "staging" and "production".
  #      Add a required reviewer to "production" for the manual gate.
  #   5. Set STAGING_FRONTEND_URL / PRODUCTION_FRONTEND_URL as environment variables
  #      in the respective GitHub environments.

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [images, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Deploy frontend to staging
        working-directory: frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy \
            --image ghcr.io/${{ steps.repo.outputs.name }}/mlb-frontend:${{ github.sha }} \
            --ha=false
      - name: Deploy consumer to staging
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy \
            --image ghcr.io/${{ steps.repo.outputs.name }}/mlb-pipeline:${{ github.sha }} \
            --ha=false
      - name: Post-deploy health check
        env:
          FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
        run: |
          echo "Waiting for machines to become ready..."
          sleep 15
          curl --fail --retry 5 --retry-delay 10 \
            "${FRONTEND_URL}/api/health"

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # The "production" GitHub environment should have a required reviewer configured
    # so this job pauses for manual approval before proceeding.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Deploy frontend to production
        working-directory: frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy \
            --image ghcr.io/${{ steps.repo.outputs.name }}/mlb-frontend:${{ github.sha }} \
            --ha=false
      - name: Deploy consumer to production
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy \
            --image ghcr.io/${{ steps.repo.outputs.name }}/mlb-pipeline:${{ github.sha }} \
            --ha=false
      - name: Post-deploy health check
        env:
          FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
        run: |
          echo "Waiting for machines to become ready..."
          sleep 15
          curl --fail --retry 5 --retry-delay 10 \
            "${FRONTEND_URL}/api/health"
